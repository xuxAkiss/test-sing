[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-pitch-lab"
version = "0.2.0"
description = "An explainable singing pitch analysis prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
media = [
  "imageio-ffmpeg>=0.5",
]
separation = [
  "demucs>=4.1,<5",
]
web = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]
test = [
  "httpx2>=2,<3",
]

[project.scripts]
karaoke-analyze = "audio_engine.cli:main"

[tool.setuptools.packages.find]
include = ["audio_engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
